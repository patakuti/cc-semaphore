name: Windows build

# Builds cc-semaphore-desktop (the Tauri v2 app) on windows-latest, since
# this project's dev machine is Ubuntu. See 02_design.md §7.1.1.
#
# Triggered on every push to a pull request (a pre-merge gate: catch
# Windows-only compile errors before they land on main) and on demand via
# workflow_dispatch. Deliberately not run on push to main — CI stays a
# pre-merge check, not a post-merge one, per the project's stated policy.
on:
  pull_request:
    paths:
      - "crates/cc-semaphore-desktop/**"
      - "crates/cc-semaphore-core/**"
      - "ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # 02_design.md §7.1.1 (2026-09-05 revision): building via `cargo
      # build` alone (the original approach) never produced the NSIS
      # installer declared in tauri.conf.json's bundle.targets — bundling
      # is the Tauri CLI's job, not cargo's. tauri-cli itself is a plain
      # crates.io crate (same supply-chain tier as every other dependency
      # here), so this stays consistent with the project's minimal/
      # crates.io-only dependency policy (01_requirements.md §4.1) rather
      # than pulling in a separate third-party GitHub Action.
      - name: Cache tauri-cli
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: windows-tauri-cli-v2

      - name: Install tauri-cli
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build cc-semaphore-desktop (binary + NSIS installer)
        working-directory: crates/cc-semaphore-desktop
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: cc-semaphore-desktop-windows
          path: target/release/cc-semaphore-desktop.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: cc-semaphore-desktop-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
