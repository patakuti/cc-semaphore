name: Release

# Publishes a GitHub Release with downloadable binaries for both
# platforms, triggered by pushing a version tag (v*). Reuses the same
# build steps as linux-build.yml / windows-build.yml (those stay
# PR-gate-only, per their own file header comments) — this workflow's
# only job is doing the same builds again for a real version tag and
# attaching the results to a release instead of a transient workflow
# artifact.
#
# workflow_dispatch (with an explicit `tag` input) exists only so this
# workflow itself can be exercised end-to-end against a throwaway tag
# before trusting it with a real version tag push.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (created if it doesn't exist yet)"
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes

  linux-binary:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build cc-semaphored (static musl binary)
        run: cargo build --release --target x86_64-unknown-linux-musl -p cc-semaphore-daemon

      - name: Rename asset
        run: cp target/x86_64-unknown-linux-musl/release/cc-semaphored cc-semaphored-linux-x86_64

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" cc-semaphored-linux-x86_64 --clobber

  windows-binary:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # See windows-build.yml for why this is the Tauri CLI, not plain
      # `cargo build` (02_design.md §7.1.1).
      - name: Cache tauri-cli
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: windows-tauri-cli-v2

      - name: Install tauri-cli
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build cc-semaphore-desktop (binary + NSIS installer)
        working-directory: crates/cc-semaphore-desktop
        run: cargo tauri build

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" --clobber \
            target/release/cc-semaphore-desktop.exe \
            target/release/bundle/nsis/*.exe
